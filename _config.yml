title: Pathos
description: Projetos, notas e artigos
lang: pt-BR
timezone: America/Sao_Paulo
theme: minima
theme_mode: dark
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: projects

header_pages:
  - about.md
  - projects.md
